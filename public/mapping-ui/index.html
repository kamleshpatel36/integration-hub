<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Integration Hub — Mapping Builder</title>
<style>
  :root {
    --bg: #0a0e17;
    --surface: #131826;
    --border: #232b3d;
    --text: #e2e4e9;
    --text-dim: #7b8496;
    --teal: #2dd4bf;
    --teal-dim: #0f766e;
    --amber: #fbbf24;
    --amber-dim: #92400e;
    --rose: #fb7185;
    --violet: #a78bfa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .mono { font-family: "SF Mono", Consolas, Monaco, monospace; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 40px 24px; }
  .eyebrow {
    display: flex; align-items: center; gap: 8px;
    color: var(--teal); font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.18em; margin-bottom: 8px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); }
  h1 { font-size: 24px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--text-dim); font-size: 14px; margin: 0 0 32px; }
  .sub .teal { color: var(--teal); font-family: monospace; }
  .sub .amber { color: var(--amber); font-family: monospace; }

  .panel {
    border: 1px solid var(--border); background: rgba(19,24,38,0.6);
    border-radius: 10px; overflow: hidden; margin-bottom: 16px;
  }
  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; cursor: pointer; user-select: none;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--text-dim);
  }
  .panel-header:hover { color: var(--text); }
  .panel-body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 10px; }
  .panel-body.hidden { display: none; }

  label { font-size: 11px; color: var(--text-dim); font-family: monospace; display: block; margin-bottom: 4px; }
  input, select {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 9px 12px; font-size: 13px; color: var(--text);
    font-family: monospace;
  }
  input:focus, select:focus { outline: none; border-color: var(--teal-dim); }

  button {
    font-family: inherit; font-weight: 600; font-size: 12px; border: none;
    border-radius: 6px; padding: 9px 16px; cursor: pointer;
  }
  .btn-primary { background: var(--teal); color: #05221f; }
  .btn-primary:hover { background: #5eead4; }
  .btn-primary:disabled { background: #3a4152; color: #6b7280; cursor: not-allowed; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-ghost:hover { border-color: #3a4152; background: rgba(255,255,255,0.03); }

  .status-ok { color: #34d399; font-size: 12px; }
  .status-err { color: var(--rose); font-size: 12px; margin-top: 6px; font-family: monospace; }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .conn-picker { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
  .label-text { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); }

  .arrow { text-align: center; color: #3a4152; margin: 10px 0; font-size: 16px; }

  .mapping-header {
    display: flex; align-items: center; justify-content: space-between; margin: 28px 0 14px;
  }
  .mapping-header h2 { font-size: 14px; margin: 0; }
  .mode-toggle { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 2px; }
  .mode-toggle button { background: transparent; color: var(--text-dim); padding: 6px 12px; }
  .mode-toggle button.active { background: #2a3244; color: #fff; }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--text-dim); padding: 10px 12px; border-bottom: 1px solid var(--border);
  }
  tbody td { padding: 8px 12px; border-bottom: 1px solid rgba(35,43,61,0.5); }
  .rule-row:hover { background: rgba(255,255,255,0.02); }
  .transform-cell { display: flex; align-items: center; gap: 6px; justify-content: center; }
  .cable-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .cable-line { height: 1px; width: 8px; background: var(--border); }
  .transform-pill {
    font-size: 10px; font-family: monospace; border-radius: 20px; padding: 4px 8px;
    border: 1px solid var(--teal-dim); background: rgba(15,118,110,0.2); color: var(--teal);
  }
  .remove-btn {
    background: transparent; border: none; color: #4b5468; cursor: pointer; font-size: 14px; padding: 4px;
  }
  .remove-btn:hover { color: var(--rose); }
  .add-row-btn {
    width: 100%; background: transparent; border: none; border-top: 1px solid var(--border);
    color: var(--text-dim); padding: 12px; font-size: 12px; text-align: left; cursor: pointer;
  }
  .add-row-btn:hover { color: var(--teal); background: rgba(255,255,255,0.02); }

  textarea {
    width: 100%; min-height: 300px; background: var(--bg); color: var(--text);
    border: none; font-family: monospace; font-size: 12px; padding: 16px; resize: vertical;
  }
  textarea:focus { outline: none; }

  .footer {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border);
  }
  .footer-info { font-size: 11px; color: var(--text-dim); font-family: monospace; }
  .footer-actions { display: flex; gap: 8px; }

  .empty-state { text-align: center; padding: 60px 0; color: var(--text-dim); border: 1px dashed var(--border); border-radius: 10px; font-size: 13px; }
  .banner {
    display: flex; align-items: center; gap: 8px; font-size: 12px; color: #fcd34d;
    background: rgba(251,191,36,0.08); border: 1px solid rgba(251,191,36,0.25);
    border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <div class="panel-header" id="configHeader">
      <span>⚙ API connection</span>
      <span id="configStatus"></span>
    </div>
    <div class="panel-body" id="configBody">
      <div>
        <label>Base URL</label>
        <input id="baseUrl" value="/api" placeholder="https://your-api.onrender.com/api">
      </div>
      <div>
        <label>API key</label>
        <input id="apiKey" type="password" placeholder="ih_live_...">
      </div>
      <button class="btn-primary" id="connectBtn" style="align-self: flex-start;">Connect</button>
      <div id="configError" class="status-err" style="display:none;"></div>
    </div>
  </div>

  <div class="eyebrow"><span class="dot"></span>New mapping</div>
  <h1><input id="mappingName" value="Customer sync" style="background:transparent;border:none;font-size:24px;font-weight:600;color:#fff;padding:0;width:100%;font-family:inherit;"></h1>
  <p class="sub" id="pathSummary"></p>

  <div id="emptyState" class="empty-state">Enter your API base URL and key above, then Connect.</div>

  <div id="mainContent" style="display:none;">
    <div class="panel" style="padding: 16px;">
      <div class="conn-picker"><span class="dot" style="background:var(--teal);"></span><span class="label-text">Source connection</span></div>
      <div class="row2">
        <select id="sourceConn"><option value="">Choose connection</option></select>
        <select id="sourceObj" disabled><option value="">Choose object type</option></select>
      </div>
    </div>
    <div class="arrow">↓</div>
    <div class="panel" style="padding: 16px;">
      <div class="conn-picker"><span class="dot" style="background:var(--amber);"></span><span class="label-text">Target connection</span></div>
      <div class="row2">
        <select id="targetConn"><option value="">Choose connection</option></select>
        <select id="targetObj" disabled><option value="">Choose object type</option></select>
      </div>
    </div>

    <div id="mappingSection" style="display:none;">
      <div class="mapping-header">
        <h2>Field mapping</h2>
        <div class="mode-toggle">
          <button class="active" id="simpleModeBtn">Simple</button>
          <button id="advancedModeBtn">&lt;/&gt; Advanced</button>
        </div>
      </div>

      <div id="unmappedBanner" class="banner" style="display:none;"></div>

      <div class="panel" id="simpleModePanel">
        <table>
          <thead><tr><th>Source field</th><th style="width:110px;text-align:center;">Transform</th><th>Target field</th><th style="width:30px;"></th></tr></thead>
          <tbody id="rulesBody"></tbody>
        </table>
        <button class="add-row-btn" id="addRuleBtn">+ Add field mapping</button>
      </div>

      <div class="panel" id="advancedModePanel" style="display:none;">
        <textarea id="jsonPreview" spellcheck="false"></textarea>
      </div>

      <div class="footer">
        <div class="footer-info" id="ruleCount">0 rules configured</div>
        <div class="footer-actions">
          <button class="btn-primary" id="saveBtn">⚡ Save mapping</button>
        </div>
      </div>
      <div id="saveError" class="status-err" style="display:none;"></div>
    </div>
  </div>
</div>

<script>
const TRANSFORMS = [
  { id: "direct", label: "Direct copy" },
  { id: "uppercase", label: "Uppercase" },
  { id: "lowercase", label: "Lowercase" },
  { id: "concat", label: "Combine fields" },
  { id: "date_format", label: "Reformat date" },
  { id: "static_value", label: "Fixed value" },
  { id: "lookup_table", label: "Lookup table" },
];

let state = {
  connections: [], sourceConnId: "", targetConnId: "",
  sourceObjTypes: [], targetObjTypes: [], sourceObj: "", targetObj: "",
  sourceFields: [], targetFields: [],
  rules: [{ id: "r1", sourceField: "", targetField: "", transform: "direct" }],
  mode: "simple", ruleIdCounter: 2,
};

function $(id) { return document.getElementById(id); }

async function api(path, options = {}) {
  const baseUrl = $("baseUrl").value.replace(/\/$/, "");
  const apiKey = $("apiKey").value;
  const resp = await fetch(baseUrl + path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      ...(apiKey ? { Authorization: "Bearer " + apiKey } : {}),
      ...(options.headers || {}),
    },
  });
  if (!resp.ok) {
    let msg = "Request failed: " + resp.status;
    try { const body = await resp.json(); if (body.error) msg = body.error; } catch (e) {}
    throw new Error(msg);
  }
  if (resp.status === 204) return null;
  return resp.json();
}

$("configHeader").addEventListener("click", () => {
  $("configBody").classList.toggle("hidden");
});

$("connectBtn").addEventListener("click", async () => {
  $("configError").style.display = "none";
  try {
    state.connections = await api("/connections");
    $("configStatus").innerHTML = '<span class="status-ok">✓ connected</span>';
    $("emptyState").style.display = "none";
    $("mainContent").style.display = "block";
    renderConnectionOptions();
  } catch (err) {
    $("configError").textContent = err.message;
    $("configError").style.display = "block";
    $("configStatus").innerHTML = "";
  }
});

function renderConnectionOptions() {
  for (const [selectId] of [["sourceConn"], ["targetConn"]]) {
    const sel = $(selectId);
    sel.innerHTML = '<option value="">Choose connection</option>' +
      state.connections.map(c => `<option value="${c.id}">${c.label} (${c.connectorType})${c.status !== "connected" ? " · " + c.status : ""}</option>`).join("");
  }
}

async function onConnChange(which) {
  const connId = $(which === "source" ? "sourceConn" : "targetConn").value;
  const objSelect = $(which === "source" ? "sourceObj" : "targetObj");
  if (which === "source") { state.sourceConnId = connId; state.sourceObj = ""; }
  else { state.targetConnId = connId; state.targetObj = ""; }
  objSelect.innerHTML = '<option value="">Choose object type</option>';
  objSelect.disabled = true;
  if (!connId) return;
  try {
    const types = await api(`/connections/${connId}/objects`);
    if (which === "source") state.sourceObjTypes = types; else state.targetObjTypes = types;
    objSelect.innerHTML = '<option value="">Choose object type</option>' + types.map(t => `<option value="${t}">${t}</option>`).join("");
    objSelect.disabled = false;
  } catch (err) { console.error(err); }
  updatePathSummary();
  checkShowMapping();
}

async function onObjChange(which) {
  const connId = which === "source" ? state.sourceConnId : state.targetConnId;
  const objType = $(which === "source" ? "sourceObj" : "targetObj").value;
  if (which === "source") state.sourceObj = objType; else state.targetObj = objType;
  try {
    const fields = await api(`/connections/${connId}/objects/${objType}/fields`);
    if (which === "source") state.sourceFields = fields; else state.targetFields = fields;
  } catch (err) { console.error(err); }
  updatePathSummary();
  checkShowMapping();
  renderRules();
}

$("sourceConn").addEventListener("change", () => onConnChange("source"));
$("targetConn").addEventListener("change", () => onConnChange("target"));
$("sourceObj").addEventListener("change", () => onObjChange("source"));
$("targetObj").addEventListener("change", () => onObjChange("target"));

function updatePathSummary() {
  const s = state.sourceObj ? `${state.sourceObj}` : "?";
  const t = state.targetObj ? `${state.targetObj}` : "?";
  $("pathSummary").innerHTML = `<span class="teal">${s}</span> → <span class="amber">${t}</span>`;
}

function checkShowMapping() {
  $("mappingSection").style.display = (state.sourceObj && state.targetObj) ? "block" : "none";
  if (state.sourceObj && state.targetObj) renderRules();
}

function renderRules() {
  const tbody = $("rulesBody");
  tbody.innerHTML = "";
  for (const rule of state.rules) {
    const tr = document.createElement("tr");
    tr.className = "rule-row";
    tr.innerHTML = `
      <td>${fieldSelectHtml(rule.id, "sourceField", state.sourceFields, rule.sourceField)}</td>
      <td>
        <div class="transform-cell">
          <span class="cable-dot" style="background:var(--teal);"></span>
          <span class="cable-line"></span>
          <select class="transform-pill" onchange="updateRule('${rule.id}','transform',this.value)">
            ${TRANSFORMS.map(t => `<option value="${t.id}" ${t.id === rule.transform ? "selected" : ""}>${t.label}</option>`).join("")}
          </select>
          <span class="cable-line"></span>
          <span class="cable-dot" style="background:var(--amber);"></span>
        </div>
      </td>
      <td>${fieldSelectHtml(rule.id, "targetField", state.targetFields, rule.targetField)}</td>
      <td><button class="remove-btn" onclick="removeRule('${rule.id}')">✕</button></td>
    `;
    tbody.appendChild(tr);
  }
  $("ruleCount").textContent = state.rules.filter(r => r.targetField).length + " rule(s) configured";
  updateJsonPreview();
  updateUnmappedBanner();
}

function fieldSelectHtml(ruleId, key, fields, value) {
  const opts = fields.map(f => `<option value="${f.name}" ${f.name === value ? "selected" : ""}>${f.name} — ${f.label}</option>`).join("");
  return `<select onchange="updateRule('${ruleId}','${key}',this.value)">
    <option value="">${fields.length === 0 ? "No fields available" : "Choose field"}</option>${opts}
  </select>`;
}

function updateRule(id, key, value) {
  const rule = state.rules.find(r => r.id === id);
  if (rule) rule[key] = value;
  renderRules();
}
function removeRule(id) {
  state.rules = state.rules.filter(r => r.id !== id);
  renderRules();
}
$("addRuleBtn").addEventListener("click", () => {
  state.rules.push({ id: "r" + (state.ruleIdCounter++), sourceField: "", targetField: "", transform: "direct" });
  renderRules();
});

function updateUnmappedBanner() {
  const unmapped = state.targetFields.filter(f => !state.rules.some(r => r.targetField === f.name)).length;
  const banner = $("unmappedBanner");
  if (unmapped > 0) {
    banner.style.display = "flex";
    banner.textContent = `⚠ ${unmapped} target field(s) not yet mapped.`;
  } else {
    banner.style.display = "none";
  }
}

function updateJsonPreview() {
  const rules = state.rules.filter(r => r.targetField).map(({ id, ...r }) => r);
  $("jsonPreview").value = JSON.stringify(rules, null, 2);
}

$("simpleModeBtn").addEventListener("click", () => setMode("simple"));
$("advancedModeBtn").addEventListener("click", () => setMode("advanced"));
function setMode(mode) {
  state.mode = mode;
  $("simpleModeBtn").classList.toggle("active", mode === "simple");
  $("advancedModeBtn").classList.toggle("active", mode === "advanced");
  $("simpleModePanel").style.display = mode === "simple" ? "block" : "none";
  $("advancedModePanel").style.display = mode === "advanced" ? "block" : "none";
}

$("saveBtn").addEventListener("click", async () => {
  $("saveError").style.display = "none";
  const btn = $("saveBtn");
  btn.disabled = true;
  btn.textContent = "Saving...";
  try {
    await api("/mappings", {
      method: "POST",
      body: JSON.stringify({
        name: $("mappingName").value,
        sourceConnectionId: state.sourceConnId,
        targetConnectionId: state.targetConnId,
        sourceObject: state.sourceObj,
        targetObject: state.targetObj,
        fieldMappings: state.rules.filter(r => r.targetField).map(({ id, ...r }) => r),
        triggerType: "poll",
        pollIntervalSec: 300,
      }),
    });
    btn.textContent = "✓ Saved";
    setTimeout(() => { btn.textContent = "⚡ Save mapping"; btn.disabled = false; }, 2000);
  } catch (err) {
    $("saveError").textContent = err.message;
    $("saveError").style.display = "block";
    btn.textContent = "⚡ Save mapping";
    btn.disabled = false;
  }
});
</script>
</body>
</html>
