<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Integration Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #090c14; --bg-elevated: #0d111c; --surface: #131826; --surface-hover: #171d2e;
    --border: #232b3d; --border-light: #2c3549; --text: #e8eaf0; --text-dim: #8890a3; --text-faint: #545e75;
    --teal: #2dd4bf; --teal-dim: #0f766e; --teal-glow: rgba(45,212,191,0.15);
    --amber: #fbbf24; --amber-dim: #92400e; --rose: #fb7185; --rose-dim: #9f1239;
    --violet: #a78bfa; --green: #34d399; --green-dim: #065f46;
    --radius: 10px; --radius-sm: 6px;
    --shadow-md: 0 4px 24px rgba(0,0,0,0.35); --shadow-lg: 0 12px 48px rgba(0,0,0,0.5);
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: 'JetBrains Mono', "SF Mono", Consolas, Monaco, monospace; }
  input, select, textarea, button { font-family: inherit; }
  input, select, textarea {
    width: 100%; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 9px 12px; font-size: 13px; color: var(--text); font-family: 'JetBrains Mono', monospace;
    transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
  }

  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--teal-dim); box-shadow: 0 0 0 3px var(--teal-glow); }
  label { font-size: 11px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; display: block; margin-bottom: 4px; letter-spacing: 0.02em; }
  button { font-weight: 600; font-size: 12px; border: none; border-radius: var(--radius-sm); padding: 9px 16px; cursor: pointer; transition: all 0.15s var(--ease); }
  .btn-primary { background: var(--teal); color: #05221f; box-shadow: 0 2px 12px var(--teal-glow); }
  .btn-primary:hover { background: #5eead4; transform: translateY(-1px); box-shadow: 0 4px 16px var(--teal-glow); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { background: #3a4152; color: #6b7280; cursor: not-allowed; box-shadow: none; transform: none; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-ghost:hover { border-color: var(--border-light); background: var(--surface-hover); }
  .btn-danger { background: transparent; border: 1px solid rgba(251,113,133,0.35); color: var(--rose); }
  .btn-danger:hover { background: rgba(251,113,133,0.1); border-color: rgba(251,113,133,0.6); }
  .btn-sm { padding: 5px 10px; font-size: 11px; }
  .status-err { color: var(--rose); font-size: 12px; margin-top: 8px; font-family: 'JetBrains Mono', monospace; }
  .status-ok { color: var(--green); font-size: 12px; }
  .panel {
    border: 1px solid var(--border); background: linear-gradient(180deg, var(--surface) 0%, rgba(19,24,38,0.5) 100%);
    border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-md);
  }
  .card { padding: 20px; }
  table { width: 100%; border-collapse: collapse; }
  thead th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); padding: 11px 16px; border-bottom: 1px solid var(--border); }
  tbody td { padding: 11px 16px; border-bottom: 1px solid rgba(35,43,61,0.5); font-size: 13px; }
  tbody tr { transition: background 0.1s var(--ease); }
  tbody tr:hover { background: rgba(255,255,255,0.025); }
  tbody tr:last-child td { border-bottom: none; }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-family: 'JetBrains Mono', monospace; padding: 3px 9px; border-radius: 20px; border: 1px solid; font-weight: 500; }
  .badge-teal { color: var(--teal); border-color: var(--teal-dim); background: rgba(15,118,110,0.15); }
  .badge-amber { color: var(--amber); border-color: #92400e; background: rgba(146,64,14,0.15); }
  .badge-rose { color: var(--rose); border-color: #9f1239; background: rgba(159,18,57,0.15); }
  .badge-green { color: var(--green); border-color: #065f46; background: rgba(6,95,70,0.15); }
  .badge-gray { color: var(--text-dim); border-color: var(--border); }
  .empty { text-align: center; padding: 56px 20px; color: var(--text-dim); font-size: 13px; }
  .empty-icon { font-size: 28px; opacity: 0.4; margin-bottom: 10px; }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(4,6,12,0.7); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px;
    animation: fadeIn 0.15s var(--ease);
  }
  .modal {
    background: var(--surface); border: 1px solid var(--border-light); border-radius: 14px;
    max-width: 640px; width: 100%; max-height: 85vh; overflow-y: auto; box-shadow: var(--shadow-lg);
    animation: modalIn 0.2s var(--ease);
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes modalIn { from { opacity: 0; transform: scale(0.97) translateY(6px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--border); }
  .modal-header h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .modal-close { background: transparent; border: none; color: var(--text-dim); font-size: 16px; cursor: pointer; padding: 6px; border-radius: 6px; transition: all 0.15s; }
  .modal-close:hover { color: var(--text); background: var(--surface-hover); }
  .modal-body { padding: 22px; display: flex; flex-direction: column; gap: 12px; }
  .field-row { display: flex; flex-direction: column; gap: 4px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .setup-steps {
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px;
    font-size: 12px; color: var(--text-dim); background: rgba(255,255,255,0.015);
  }
  .setup-steps summary { cursor: pointer; color: var(--teal); font-weight: 600; font-size: 12px; }
  .setup-steps ol { margin: 10px 0 2px; padding-left: 18px; display: flex; flex-direction: column; gap: 10px; }
  .setup-steps li { color: var(--text); line-height: 1.5; }
  .setup-steps code {
    background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
    padding: 1px 5px; font-family: monospace; color: var(--amber); display: inline-block; margin-top: 3px;
  }

  /* Drag-and-drop field mapper */
  .dnd-mapper { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 10px; }
  .dnd-col-title { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 8px; }
  .dnd-field-list { display: flex; flex-direction: column; gap: 6px; max-height: 360px; overflow-y: auto; padding-right: 2px; }
  .dnd-group-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #4b5468; margin: 8px 0 2px; }
  .dnd-group-label:first-child { margin-top: 0; }
  .field-pill {
    display: flex; align-items: center; gap: 6px; padding: 7px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); font-family: monospace; font-size: 12px;
    cursor: grab; user-select: none;
  }
  .field-pill:active { cursor: grabbing; }
  .field-pill.source-pill { border-left: 2px solid var(--teal); }
  .field-pill.source-pill.custom { border-left-color: var(--violet); }
  .field-pill .type-tag { margin-left: auto; font-size: 9px; color: var(--text-dim); text-transform: uppercase; }

  .target-drop {
    border: 1px dashed var(--border); border-radius: 8px; padding: 10px; font-size: 12px;
    transition: border-color 0.15s, background 0.15s;
  }
  .target-drop.drag-over { border-color: var(--teal); background: rgba(45,212,191,0.06); }
  .target-drop.mapped { border-style: solid; background: rgba(255,255,255,0.02); }
  .target-drop-header { display: flex; align-items: center; justify-content: space-between; font-family: monospace; }
  .target-drop-empty { color: var(--text-dim); font-size: 11px; padding: 4px 0; }
  .target-mapping-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 11px; color: var(--text-dim); }
  .target-mapping-actions { display: flex; gap: 4px; margin-left: auto; }
  .icon-btn { background: transparent; border: none; color: var(--text-dim); cursor: pointer; font-size: 12px; padding: 2px 4px; }
  .icon-btn:hover { color: var(--teal); }
  .icon-btn.danger:hover { color: var(--rose); }
  .op-config { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
  .op-config select, .op-config input, .op-config textarea { font-size: 11px; padding: 6px 8px; }
  .op-config textarea { font-family: monospace; min-height: 60px; }
  .lookup-row { display: flex; gap: 4px; align-items: center; }
  .op-hint { font-size: 10px; color: var(--text-dim); line-height: 1.4; }

  .mapped-summary { margin-bottom: 14px; }
  .mapped-summary-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .mapped-chip {
    display: flex; align-items: center; gap: 5px; font-size: 11px; font-family: monospace;
    background: rgba(45,212,191,0.06); border: 1px solid var(--teal-dim); border-radius: 20px; padding: 4px 6px 4px 10px;
  }
  .mb-toolbar { display: flex; gap: 6px; align-items: center; margin: 10px 0 6px; }
  .mb-toolbar-spacer { flex: 1; }
  .search-input { margin-bottom: 8px; }
  .field-pill.used { opacity: 0.55; }
  .field-pill .used-badge { color: var(--teal); font-size: 10px; margin-left: 4px; }
  .suggest-panel { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); display: flex; flex-direction: column; gap: 6px; }
  .suggest-results { display: flex; flex-wrap: wrap; gap: 6px; }
  .suggest-pill {
    background: var(--bg); border: 1px solid var(--teal-dim); color: var(--teal); font-family: monospace;
    font-size: 11px; border-radius: 20px; padding: 4px 10px; cursor: pointer;
  }
  .suggest-pill:hover { background: rgba(45,212,191,0.1); }
  .suggest-pill .score { color: var(--text-dim); margin-left: 4px; }
  .target-drop-empty-btn {
    background: transparent; border: none; color: var(--text-dim); font-size: 11px; padding: 4px 0;
    cursor: pointer; text-align: left; width: 100%;
  }
  .target-drop-empty-btn:hover { color: var(--teal); }

  /* Login screen */
  #loginScreen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-card { width: 100%; max-width: 380px; }
  .login-eyebrow { display: flex; align-items: center; gap: 8px; color: var(--teal); font-size: 11px; text-transform: uppercase; letter-spacing: 0.18em; margin-bottom: 8px; justify-content: center; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); }
  .login-title { text-align: center; font-size: 22px; font-weight: 600; margin: 0 0 28px; }
  .role-toggle { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 3px; margin-bottom: 16px; }
  .role-toggle button { flex: 1; background: transparent; color: var(--text-dim); padding: 8px; border-radius: 6px; }
  .role-toggle button.active { background: #2a3244; color: #fff; }

  /* Dashboard shell */
  #dashboard { display: none; min-height: 100vh; }
  .app-shell { display: flex; min-height: 100vh; }
  .sidebar {
    width: 232px; background: var(--bg-elevated); border-right: 1px solid var(--border);
    padding: 22px 0; display: flex; flex-direction: column; box-shadow: var(--shadow-md);
    position: relative; z-index: 1;
  }
  .sidebar-header { padding: 0 20px 22px; }
  .sidebar-brand { display: flex; align-items: center; gap: 8px; color: var(--teal); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 6px; }
  .sidebar-brand-icon { width: 16px; height: 16px; }
  .sidebar-role { font-size: 11px; color: var(--text-faint); font-family: 'JetBrains Mono', monospace; }
  .nav-item {
    display: flex; align-items: center; gap: 11px; padding: 10px 20px; color: var(--text-dim);
    cursor: pointer; font-size: 13px; font-weight: 500; border-left: 2px solid transparent;
    transition: all 0.15s var(--ease); position: relative;
  }
  .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.75; }
  .nav-item:hover { color: var(--text); background: rgba(255,255,255,0.025); }
  .nav-item.active { color: var(--teal); border-left-color: var(--teal); background: var(--teal-glow); }
  .nav-item.active svg { opacity: 1; }
  .sidebar-footer { margin-top: auto; padding: 16px 20px 0; border-top: 1px solid var(--border); }
  .main-area { flex: 1; padding: 34px 44px; overflow-y: auto; max-width: 1180px; }
  .view-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; }
  .view-title { font-size: 21px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .view-sub { color: var(--text-dim); font-size: 13px; margin: 5px 0 0; }

  /* Mapping builder bits (reused from standalone tool) */
  .cable-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .cable-line { height: 1px; width: 8px; background: var(--border); }
  .transform-cell { display: flex; align-items: center; gap: 6px; justify-content: center; }
  .transform-pill { font-size: 10px; font-family: monospace; border-radius: 20px; padding: 4px 8px; border: 1px solid var(--teal-dim); background: rgba(15,118,110,0.2); color: var(--teal); }
  .remove-btn { background: transparent; border: none; color: #4b5468; cursor: pointer; font-size: 14px; padding: 4px; }
  .remove-btn:hover { color: var(--rose); }

  /* Dashboard overview */
  .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 28px; }
  .metric-card {
    background: linear-gradient(150deg, var(--surface) 0%, var(--bg-elevated) 100%);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px;
    box-shadow: var(--shadow-md); transition: transform 0.15s var(--ease), border-color 0.15s var(--ease);
  }
  .metric-card:hover { transform: translateY(-2px); border-color: var(--border-light); }
  .metric-card-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
  .metric-card-value { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
  .metric-card-sub { font-size: 12px; color: var(--text-dim); margin-top: 8px; }
  .metric-card-sub .good { color: var(--green); } .metric-card-sub .bad { color: var(--rose); }
  .metric-accent-teal { border-left: 2px solid var(--teal); }
  .metric-accent-amber { border-left: 2px solid var(--amber); }
  .metric-accent-rose { border-left: 2px solid var(--rose); }
  .metric-accent-violet { border-left: 2px solid var(--violet); }
  .section-title { font-size: 13px; font-weight: 700; color: var(--text); margin: 28px 0 12px; display: flex; align-items: center; justify-content: space-between; }

  /* Activity log */
  .activity-row { display: flex; gap: 12px; padding: 13px 16px; border-bottom: 1px solid rgba(35,43,61,0.5); align-items: flex-start; }
  .activity-row:last-child { border-bottom: none; }
  .activity-icon {
    width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 13px; background: var(--bg-elevated); border: 1px solid var(--border);
  }
  .activity-body { flex: 1; min-width: 0; }
  .activity-action { font-size: 13px; color: var(--text); }
  .activity-action b { font-weight: 600; }
  .activity-meta { font-size: 11px; color: var(--text-faint); font-family: 'JetBrains Mono', monospace; margin-top: 3px; word-break: break-word; }
  .activity-time { font-size: 11px; color: var(--text-faint); font-family: 'JetBrains Mono', monospace; white-space: nowrap; flex-shrink: 0; }
  .actor-pill { font-size: 9px; text-transform: uppercase; letter-spacing: 0.05em; padding: 1px 6px; border-radius: 10px; margin-left: 6px; }
  .actor-tenant { background: var(--teal-glow); color: var(--teal); }
  .actor-admin { background: rgba(167,139,250,0.15); color: var(--violet); }
  .actor-system { background: rgba(139,144,163,0.15); color: var(--text-dim); }
  .activity-filter-bar { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .filter-chip {
    font-size: 11px; font-family: 'JetBrains Mono', monospace; padding: 5px 12px; border-radius: 20px;
    border: 1px solid var(--border); color: var(--text-dim); cursor: pointer; background: transparent; transition: all 0.15s;
  }
  .filter-chip:hover { border-color: var(--border-light); color: var(--text); }
  .filter-chip.active { background: var(--teal-glow); border-color: var(--teal-dim); color: var(--teal); }

  /* Toasts (replaces alert()) */
  #toastRoot { position: fixed; bottom: 24px; right: 24px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    background: var(--surface); border: 1px solid var(--border-light); border-radius: var(--radius-sm);
    padding: 12px 16px; font-size: 13px; box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 10px;
    min-width: 240px; max-width: 360px; animation: toastIn 0.2s var(--ease);
  }
  .toast.leaving { animation: toastOut 0.15s var(--ease) forwards; }
  @keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes toastOut { to { opacity: 0; transform: translateX(20px); } }
  .toast-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .toast-success .toast-dot { background: var(--green); } .toast-error .toast-dot { background: var(--rose); } .toast-info .toast-dot { background: var(--teal); }

  /* Custom confirm modal (replaces confirm()) */
  .confirm-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }

  /* Job detail */
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; }
  .detail-item-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); margin-bottom: 3px; }
  .detail-item-value { font-size: 13px; font-family: 'JetBrains Mono', monospace; word-break: break-word; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-eyebrow"><span class="dot"></span>Integration Hub</div>
    <h1 class="login-title">Sign in</h1>
    <div class="role-toggle">
      <button class="active" id="roleTenantBtn" onclick="setLoginRole('tenant')">Tenant</button>
      <button id="roleAdminBtn" onclick="setLoginRole('admin')">Admin</button>
    </div>
    <div class="panel card" style="display:flex;flex-direction:column;gap:12px;">
      <div class="field-row">
        <label>API Base URL</label>
        <input id="loginBaseUrl" value="/api" placeholder="https://your-api.onrender.com/api">
      </div>
      <div class="field-row" id="tenantKeyField">
        <label>Tenant API key</label>
        <input id="loginTenantKey" type="password" placeholder="ih_live_...">
      </div>
      <div class="field-row" id="adminKeyField" style="display:none;">
        <label>Admin key</label>
        <input id="loginAdminKey" type="password" placeholder="admin key">
      </div>
      <button class="btn-primary" id="loginBtn" onclick="doLogin()">Sign in</button>
      <div id="loginError" class="status-err" style="display:none;"></div>
    </div>
  </div>
</div>

<!-- ============ DASHBOARD ============ -->
<div id="dashboard">
  <div class="app-shell">
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand"><span class="dot"></span>Integration Hub</div>
        <div class="sidebar-role" id="sidebarRole"></div>
      </div>
      <div id="navItems"></div>
      <div class="sidebar-footer">
        <button class="btn-ghost btn-sm" style="width:100%;" onclick="doLogout()">Sign out</button>
      </div>
    </div>
    <div class="main-area" id="mainArea"></div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
// ───────────────────────── State & auth ─────────────────────────
let session = JSON.parse(localStorage.getItem("ih_session") || "null");
let loginRole = "tenant";
let currentView = null;
let viewCache = {}; // holds fetched lists per view for reuse (e.g. connections list for mapping builder)

function $(id) { return document.getElementById(id); }

function setLoginRole(role) {
  loginRole = role;
  $("roleTenantBtn").classList.toggle("active", role === "tenant");
  $("roleAdminBtn").classList.toggle("active", role === "admin");
  $("tenantKeyField").style.display = role === "tenant" ? "block" : "none";
  $("adminKeyField").style.display = role === "admin" ? "block" : "none";
}

async function api(path, options = {}) {
  const baseUrl = session.baseUrl.replace(/\/$/, "");
  const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
  if (session.role === "admin") headers["X-Admin-Key"] = session.key;
  else headers["Authorization"] = "Bearer " + session.key;
  const resp = await fetch(baseUrl + path, { ...options, headers });
  if (!resp.ok) {
    let msg = "Request failed: " + resp.status;
    try { const body = await resp.json(); if (body.error) msg = body.error; } catch (e) {}
    throw new Error(msg);
  }
  if (resp.status === 204) return null;
  return resp.json();
}

async function doLogin() {
  const baseUrl = $("loginBaseUrl").value.trim() || "/api";
  const key = loginRole === "tenant" ? $("loginTenantKey").value.trim() : $("loginAdminKey").value.trim();
  $("loginError").style.display = "none";
  if (!key) { showLoginError("Enter a key."); return; }

  session = { role: loginRole, key, baseUrl };
  try {
    // Validate the key actually works before committing to it
    if (loginRole === "tenant") await api("/tenants/me");
    else await api("/tenants"); // admin-only list endpoint doubles as an auth check
    localStorage.setItem("ih_session", JSON.stringify(session));
    showDashboard();
  } catch (err) {
    session = null;
    showLoginError(err.message);
  }
}

function showLoginError(msg) {
  $("loginError").textContent = msg;
  $("loginError").style.display = "block";
}

function doLogout() {
  localStorage.removeItem("ih_session");
  session = null;
  location.reload();
}

// ───────────────────────── shared helpers: time + activity formatting ─────────────────────────
function formatRelativeTime(dateStr) {
  const diffSec = Math.floor((Date.now() - new Date(dateStr).getTime()) / 1000);
  if (diffSec < 5) return "just now";
  if (diffSec < 60) return diffSec + "s ago";
  const min = Math.floor(diffSec / 60);
  if (min < 60) return min + "m ago";
  const hr = Math.floor(min / 60);
  if (hr < 24) return hr + "h ago";
  const day = Math.floor(hr / 24);
  if (day < 30) return day + "d ago";
  return new Date(dateStr).toLocaleDateString();
}
function activityIcon(action) {
  if (action.includes("created")) return "＋";
  if (action.includes("deleted")) return "✕";
  if (action.includes("paused")) return "⏸";
  if (action.includes("resumed") || action.includes("triggered")) return "▶";
  if (action.includes("updated")) return "✎";
  if (action.includes("completed")) return "✓";
  if (action.includes("failed")) return "!";
  return "•";
}
function activityLabel(log) {
  const [type, verb] = log.action.split(".");
  const typeLabel = type.charAt(0).toUpperCase() + type.slice(1);
  const verbLabel = (verb || "").replace(/_/g, " ");
  const m = log.metadata || {};
  const extra = m.label || m.name || m.mappingName ? ` "${m.label || m.name || m.mappingName}"` : "";
  return `<b>${typeLabel}</b>${extra} ${verbLabel}`;
}
function renderActivityRow(log) {
  const skip = new Set(["label", "name", "mappingName"]);
  const metaBits = Object.entries(log.metadata || {})
    .filter(([k]) => !skip.has(k))
    .map(([k, v]) => `${k}: ${typeof v === "object" ? JSON.stringify(v) : v}`);
  return `
    <div class="activity-row">
      <div class="activity-icon">${activityIcon(log.action)}</div>
      <div class="activity-body">
        <div class="activity-action">${activityLabel(log)}<span class="actor-pill actor-${log.actor}">${log.actor}</span></div>
        ${metaBits.length ? `<div class="activity-meta">${metaBits.join(" · ")}</div>` : ""}
      </div>
      <div class="activity-time">${formatRelativeTime(log.createdAt)}</div>
    </div>`;
}

// Toast notifications — replaces alert() for non-blocking feedback.
let toastCounter = 0;
function toast(message, type) {
  type = type || "info";
  const id = "toast-" + (toastCounter++);
  const el = document.createElement("div");
  el.className = "toast toast-" + type;
  el.id = id;
  el.innerHTML = `<span class="toast-dot"></span><span>${message}</span>`;
  $("toastRoot").appendChild(el);
  setTimeout(() => {
    el.classList.add("leaving");
    setTimeout(() => el.remove(), 180);
  }, 3200);
}

// Custom confirm modal — replaces confirm() so destructive actions get a
// styled dialog instead of the browser's default. Promise-based so call
// sites can keep using `if (!(await confirmModal(...))) return;`.
function confirmModal(message, opts) {
  const danger = opts && opts.danger;
  return new Promise((resolve) => {
    const cleanup = (result) => { closeModal(); resolve(result); };
    openModal(opts && opts.title || "Are you sure?", `
      <p style="font-size:13px;color:var(--text-dim);line-height:1.5;margin:0;">${message}</p>
      <div class="confirm-actions">
        <button class="btn-ghost btn-sm" onclick="window.__confirmModalResolve(false)">Cancel</button>
        <button class="${danger ? "btn-danger" : "btn-primary"} btn-sm" onclick="window.__confirmModalResolve(true)">${(opts && opts.confirmLabel) || "Confirm"}</button>
      </div>
    `);
    window.__confirmModalResolve = cleanup;
  });
}

        <div class="field-row"><label>Access Token <span style="color:var(--text-dim);font-weight:400;">(optional)</span></label><input id="cf_accessToken" type="password" placeholder="leave blank — auto-fetched"></div>
        <div class="field-row"><label>Token Expires At <span style="color:var(--text-dim);font-weight:400;">(optional)</span></label><input id="cf_tokenExpiresAt" placeholder="leave blank — auto-refreshed"></div>
      </div>
      <details class="setup-steps">
        <summary>How to get these values from NetSuite ▾</summary>
        <ol>
          <li><b>Enable the feature.</b> Setup → Company → Enable Features → SuiteCloud tab → check <b>OAuth 2.0</b> → Save.</li>
          <li><b>Create an Integration record.</b> Setup → Integration → Manage Integrations → New. Name it, under Authentication check <b>Authorization Code Grant</b> with a Redirect URI you control (any URL that can show you the <code>?code=</code> in its address bar works, even a scratch page). Save — NetSuite shows <b>Client ID</b> and <b>Client Secret</b> exactly once. Copy both now.</li>
          <li><b>Assign permissions.</b> Setup → Users/Roles → Manage Roles — make sure the role you'll authorize with has <b>REST Web Services</b> permission plus view/edit access to whatever record types you plan to sync (Customer, Sales Order, etc.).</li>
          <li><b>Authorize once, in a browser.</b> Visit:<br>
            <code style="font-size:10px;word-break:break-all;">https://{accountId}.app.netsuite.com/app/login/oauth2/authorize.nl?response_type=code&client_id={clientId}&redirect_uri={yourRedirectUri}&scope=restlets%20rest_webservices&state=xyz</code><br>
            Log in, approve, and NetSuite redirects to your Redirect URI with a <code>code</code> in the URL — copy that code.</li>
          <li><b>Exchange the code for a refresh token.</b> One-time <code>curl</code>, replacing the placeholders:<br>
            <code style="font-size:10px;word-break:break-all;">curl -X POST https://{accountId}.suitetalk.api.netsuite.com/services/rest/auth/oauth2/v1/token -d grant_type=authorization_code -d code={theCode} -d redirect_uri={yourRedirectUri} -u {clientId}:{clientSecret}</code><br>
            The response's <code>refresh_token</code> field is what goes in the field above — it's long-lived; this connector auto-refreshes the access token from it on every use, so Access Token/Token Expires At above can stay blank.</li>
        </ol>
      </details>`;
  }
}

function jsonPlaceholderFor(type) {
  if (type === "NETSUITE") return '{"authType":"oauth2","accountId":"...","clientId":"...","clientSecret":"...","refreshToken":"..."}';
  return '{"baseUrl":"https://...","authHeader":"Authorization","authValue":"Bearer ...","knownObjectTypes":["customer"]}';
}

function buildCredentialsFromForm() {
  const type = $("newConnType").value;
  if (credMode === "json") {
    return JSON.parse($("newConnCreds").value || "{}");
  }
  if (type === "NETSUITE") {
    const authType = $("cf_authType").value;
    const accountId = $("cf_accountId").value.trim();
    if (!accountId) throw new Error("Missing required field: accountId");

    if (authType === "oauth1") {
      const creds = {
        authType: "oauth1",
        accountId,
        consumerKey: $("cf_consumerKey").value.trim(),
        consumerSecret: $("cf_consumerSecret").value.trim(),
        tokenId: $("cf_tokenId").value.trim(),
        tokenSecret: $("cf_tokenSecret").value.trim(),
      };
      const missing = ["consumerKey", "consumerSecret", "tokenId", "tokenSecret"].filter(k => !creds[k]);
      if (missing.length) throw new Error("Missing required field(s): " + missing.join(", "));
      return creds;
    }

    const creds = {
      authType: "oauth2",
      accountId,
      clientId: $("cf_clientId").value.trim(),
      clientSecret: $("cf_clientSecret").value.trim(),
      refreshToken: $("cf_refreshToken").value.trim(),
    };
    const accessToken = $("cf_accessToken").value.trim();
    const tokenExpiresAt = $("cf_tokenExpiresAt").value.trim();
    if (accessToken) creds.accessToken = accessToken;
    if (tokenExpiresAt) creds.tokenExpiresAt = tokenExpiresAt;
    const missing = ["clientId", "clientSecret", "refreshToken"].filter(k => !creds[k]);
    if (missing.length) throw new Error("Missing required field(s): " + missing.join(", "));
    return creds;
  }
  const baseUrl = $("cf_baseUrl").value.trim();
  const authHeader = $("cf_authHeader").value.trim();
  const authValue = $("cf_authValue").value.trim();
  const knownObjectTypes = $("cf_knownObjectTypes").value.split(",").map(s => s.trim()).filter(Boolean);
  if (!baseUrl) throw new Error("Base URL is required");
  return { baseUrl, authHeader: authHeader || "Authorization", authValue, knownObjectTypes };
}

async function createConnection() {
  const errEl = $("newConnError");
  errEl.style.display = "none";
  let credentials;
  try { credentials = buildCredentialsFromForm(); }
  catch (e) { errEl.textContent = e.message.includes("JSON") ? "Credentials must be valid JSON" : e.message; errEl.style.display = "block"; return; }
  try {
    await api("/connections", { method: "POST", body: JSON.stringify({
      connectorType: $("newConnType").value, label: $("newConnLabel").value, credentials,
    })});
    closeModal();
    renderConnectionsView();
  } catch (err) { errEl.textContent = err.message; errEl.style.display = "block"; }
}

async function mbObjChange(which) {
  const connId = which === "source" ? builderState.sourceConnId : builderState.targetConnId;
  const objType = $(which === "source" ? "mbSourceObj" : "mbTargetObj").value;
  if (which === "source") builderState.sourceObj = objType; else builderState.targetObj = objType;
  try {
    // Field lists are fetched live from the connected account (see
    // GET /connections/:id/objects/:type/fields) — this includes custom
    // fields for NetSuite, flagged via isCustom and grouped separately below.
    const fields = await api(`/connections/${connId}/objects/${objType}/fields`);

function findRule(targetField) { return builderState.rules.find(r => r.targetField === targetField); }
function isSourceFieldUsed(name) {
  return builderState.rules.some(r => r.sourceField === name || (r.sourceFields || []).includes(name));
}

// ── Name-similarity matching, used by both "Auto-map by name" and the
// per-target suggestion list. Pure string comparison, no external calls —
// normalizes away casing/underscores/dots so "firstName" ~ "first_name" ~
// "FIRSTNAME" all score as an exact match, then falls back to substring and
// edit-distance scoring for partial matches (e.g. NetSuite's
// "custentity_region" against a target field just called "region"). ──
function normalizeFieldName(name) { return name.toLowerCase().replace(/[^a-z0-9]/g, ""); }
function levenshtein(a, b) {
  const dp = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 0; j <= b.length; j++) dp[0][j] = j;
  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
    }
  }
  return dp[a.length][b.length];
}
function similarityScore(a, b) {
  const na = normalizeFieldName(a), nb = normalizeFieldName(b);
  if (!na || !nb) return 0;
  if (na === nb) return 100;
  if (na.includes(nb) || nb.includes(na)) return 85;
  const dist = levenshtein(na, nb);
  return Math.round((1 - dist / Math.max(na.length, nb.length)) * 100);
}
function suggestSourceFieldsFor(targetFieldName, limit) {
  return builderState.sourceFields
    .map(f => ({ field: f, score: similarityScore(f.name, targetFieldName) }))
    .filter(x => x.score > 30)
    .sort((a, b) => b.score - a.score)
    .slice(0, limit || 6);
}

// One-click bulk mapping: wires every target field to its best-scoring
// unmapped source field, but only when confident (score >= 70) — anything
// murkier is left for the user to pick via the per-target suggestion list
// instead of guessing wrong silently.
function mbAutoMapByName() {
  let mapped = 0;
  builderState.targetFields.forEach(tf => {
    if (findRule(tf.name)) return;
    const [best] = suggestSourceFieldsFor(tf.name, 1);
    if (best && best.score >= 70) {
      builderState.rules.push({ targetField: tf.name, transform: "direct", sourceField: best.field.name });
      mapped++;
    }
  });
  mbRenderSourceFields();
  mbRenderTargetFields();
  toast(mapped === 0 ? "No confident name matches found — map manually or click a target for suggestions." : `Auto-mapped ${mapped} field${mapped === 1 ? "" : "s"}`, mapped === 0 ? "info" : "success");
}
async function mbClearAllMappings() {
  if (builderState.rules.length && !(await confirmModal("Remove all " + builderState.rules.length + " field mapping(s)?", { danger: true, confirmLabel: "Clear all" }))) return;
  builderState.rules = [];
  builderState.openConfigFor = null;
  builderState.suggestOpenFor = null;
  mbRenderSourceFields();
  mbRenderTargetFields();
}

function mbFilterSourceList(query) { builderState.sourceSearchQuery = query; mbRenderSourceFields(); }
function mbFilterTargetList(query) { builderState.targetSearchQuery = query; mbRenderTargetFields(); }

function mbRenderSourceFields() {
  const q = (builderState.sourceSearchQuery || "").toLowerCase();
  const visible = q ? builderState.sourceFields.filter(f => f.name.toLowerCase().includes(q)) : builderState.sourceFields;
  const standard = visible.filter(f => !f.isCustom);
  const custom = visible.filter(f => f.isCustom);
  let html = "";
  if (standard.length) html += `<div class="dnd-group-label">Standard</div>` + standard.map(mbSourcePillHtml).join("");
  if (custom.length) html += `<div class="dnd-group-label">Custom</div>` + custom.map(mbSourcePillHtml).join("");
  if (!standard.length && !custom.length) html = `<div class="target-drop-empty">${builderState.sourceFields.length ? "No fields match your search" : "No fields loaded for this object type"}</div>`;
  $("mbSourceFieldList").innerHTML = html;
}
function mbSourcePillHtml(f) {
  const used = isSourceFieldUsed(f.name);
  return `<div class="field-pill source-pill ${f.isCustom ? "custom" : ""} ${used ? "used" : ""}" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${f.name}')" title="${used ? "Already used in a mapping — you can still map it again" : ""}">
    <span>${f.name}</span>${used ? '<span class="used-badge">✓</span>' : ""}<span class="type-tag">${f.type}</span>
  </div>`;
}

function mbRenderTargetFields() {
  const q = (builderState.targetSearchQuery || "").toLowerCase();
  const visible = q ? builderState.targetFields.filter(f => f.name.toLowerCase().includes(q)) : builderState.targetFields;

  $("mbTargetFieldList").innerHTML = visible.length === 0
    ? `<div class="target-drop-empty">${builderState.targetFields.length ? "No fields match your search" : "No fields loaded for this object type"}</div>`
    : visible.map(f => {
        const rule = findRule(f.name);
        const isOpen = builderState.openConfigFor === f.name;
        const suggestOpen = builderState.suggestOpenFor === f.name;
        return `
          <div class="target-drop ${rule ? "mapped" : ""}" ondragover="event.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="mbDrop(event,'${f.name}')">
            <div class="target-drop-header">
              <span class="mono">${f.name}${f.isCustom ? ' <span style="color:var(--violet);font-size:9px;">custom</span>' : ""}</span>
            </div>
            ${rule ? `
              <div class="target-mapping-row">
                <span class="cable-dot" style="background:var(--teal);"></span>
                <span class="mono" style="color:var(--text);">${rule.sourceField || (rule.transform === "concat" ? (rule.sourceFields || []).join("+") || "(pick fields)" : rule.transform === "static_value" ? "(fixed value)" : "(unset)")}</span>
                <span class="transform-pill" style="cursor:default;">${(TRANSFORMS.find(t => t.id === rule.transform) || {}).label || rule.transform}</span>
                <div class="target-mapping-actions">
                  <button class="icon-btn" onclick="mbToggleOpConfig('${f.name}')" title="Configure operation">⚙</button>
                  <button class="icon-btn danger" onclick="mbRemoveMapping('${f.name}')" title="Remove">✕</button>
                </div>
              </div>
              ${isOpen ? mbRenderOpConfig(rule) : ""}
            ` : `
              <button class="target-drop-empty-btn" onclick="mbToggleSuggestions('${f.name}')">
                ${suggestOpen ? "▾" : "▸"} Drop a source field here, or click for suggestions
              </button>
              ${suggestOpen ? mbRenderSuggestPanel(f.name) : ""}
            `}
          </div>`;
      }).join("");

  mbRenderMappedSummary();
}

function mbRenderMappedSummary() {
  const el = $("mbMappedSummary");
  if (!el) return;
  const mapped = builderState.rules.filter(isRuleComplete);
  if (mapped.length === 0) {
    el.innerHTML = `<div class="op-hint">No fields mapped yet.</div>`;
    return;
  }
  el.innerHTML = `<div class="mapped-summary-list">${
    mapped.map(r => {
      const srcLabel = r.sourceField || (r.transform === "concat" ? (r.sourceFields || []).join("+") : r.transform === "static_value" ? "(fixed)" : r.transform === "custom_js" ? "(expression)" : "?");
      return `<div class="mapped-chip">${srcLabel} → ${r.targetField}
        <button class="icon-btn danger" style="padding:0;" onclick="mbRemoveMapping('${r.targetField}')">✕</button>
      </div>`;
    }).join("")
  }</div>`;
}

// Click-to-map: an alternative to dragging. Opens a small panel under the
// target field showing the best name-matched source fields (clickable to
// map instantly) plus a live search box for anything else.
function mbToggleSuggestions(targetField) {
  builderState.suggestOpenFor = builderState.suggestOpenFor === targetField ? null : targetField;
  mbRenderTargetFields();
}
function safeId(s) { return "sg_" + String(s).replace(/[^a-zA-Z0-9_]/g, "_"); }
function mbRenderSuggestPanel(targetField) {
  const id = safeId(targetField);
  return `
    <div class="suggest-panel">
      <input class="search-input" style="margin-bottom:0;" placeholder="Search any source field..." oninput="mbFilterSuggestions('${targetField}', this.value)">
      <div id="${id}" class="suggest-results">${mbSuggestResultsHtml(targetField, "")}</div>
    </div>`;
}
function mbSuggestResultsHtml(targetField, query) {
  const fields = query
    ? builderState.sourceFields.filter(f => f.name.toLowerCase().includes(query.toLowerCase())).map(f => ({ field: f, score: null }))
    : suggestSourceFieldsFor(targetField, 8);
  if (fields.length === 0) return `<span class="op-hint">No matches</span>`;
  return fields.map(x => `<span class="suggest-pill" onclick="mbQuickMap('${targetField}','${x.field.name}')">${x.field.name}${x.score !== null ? `<span class="score">${x.score}%</span>` : ""}</span>`).join("");
}
function mbFilterSuggestions(targetField, query) {
  // Only touches the results div, not the search input itself — keeps
  // focus/cursor position intact while typing (re-rendering the whole
  // panel on every keystroke would reset the input).
  const el = document.getElementById(safeId(targetField));
  if (el) el.innerHTML = mbSuggestResultsHtml(targetField, query);
}
function mbQuickMap(targetField, sourceField) {
  let rule = findRule(targetField);
  if (!rule) { rule = { targetField, transform: "direct" }; builderState.rules.push(rule); }
  rule.sourceField = sourceField;
  builderState.suggestOpenFor = null;
  mbRenderSourceFields();
  mbRenderTargetFields();
}

function mbDrop(event, targetField) {
  event.preventDefault();
  event.currentTarget.classList.remove("drag-over");
  const sourceField = event.dataTransfer.getData("text/plain");
  if (!sourceField) return;
  let rule = findRule(targetField);
  if (!rule) { rule = { targetField, transform: "direct" }; builderState.rules.push(rule); }
  rule.sourceField = sourceField;
  mbRenderSourceFields();
  mbRenderTargetFields();
}

function mbToggleOpConfig(targetField) {
  builderState.openConfigFor = builderState.openConfigFor === targetField ? null : targetField;
  mbRenderTargetFields();
}

function mbRemoveMapping(targetField) {
  builderState.rules = builderState.rules.filter(r => r.targetField !== targetField);
  if (builderState.openConfigFor === targetField) builderState.openConfigFor = null;
  mbRenderSourceFields();
  mbRenderTargetFields();
}

// The "one layer of data operation on the value" — every wired connection
// defaults to a direct copy, but can be reconfigured here to any of the
// transform engine's operations (src/services/transformEngine.ts on the
// backend). This panel is just a UI for the same FieldMappingRule shape the
// API already accepts; nothing new on the backend was needed for this part.
function mbRenderOpConfig(rule) {
  const tf = rule.targetField;
  let html = `<div class="op-config">
    <select onchange="mbSetTransform('${tf}',this.value)">
      ${TRANSFORMS.map(t => `<option value="${t.id}" ${t.id === rule.transform ? "selected" : ""}>${t.label}</option>`).join("")}
    </select>`;

  if (rule.transform === "concat") {
    const selected = rule.sourceFields || (rule.sourceField ? [rule.sourceField] : []);
    html += `<div class="op-hint">Fields to combine, in order checked:</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">
        ${builderState.sourceFields.map(f => `
          <label style="display:flex;align-items:center;gap:4px;font-size:11px;">
            <input type="checkbox" ${selected.includes(f.name) ? "checked" : ""} onchange="mbToggleConcatField('${tf}','${f.name}',this.checked)"> ${f.name}
          </label>`).join("")}
      </div>
      <input placeholder="separator (e.g. a space)" value="${rule.separator || ""}" onchange="mbUpdateOpField('${tf}','separator',this.value)">`;
  } else if (rule.transform === "date_format") {
    html += `<input placeholder="e.g. YYYY-MM-DD" value="${rule.dateFormat || "YYYY-MM-DD"}" onchange="mbUpdateOpField('${tf}','dateFormat',this.value)">
      <div class="op-hint">Tokens: YYYY, MM, DD</div>`;
  } else if (rule.transform === "static_value") {
    html += `<input placeholder="fixed value written to every record" value="${rule.staticValue || ""}" onchange="mbUpdateOpField('${tf}','staticValue',this.value)">`;
  } else if (rule.transform === "lookup_table") {
    const pairs = rule.lookupPairs || Object.entries(rule.lookupTable || {}).map(([k, v]) => ({ k, v }));
    rule.lookupPairs = pairs;
    html += `<div class="op-hint">Maps the source value → an output value:</div>`;
    pairs.forEach((p, i) => {
      html += `<div class="lookup-row">
        <input placeholder="source value" value="${p.k}" style="flex:1;" onchange="mbUpdateLookupPair('${tf}',${i},'k',this.value)">
        <span style="color:var(--text-dim);">→</span>
        <input placeholder="output value" value="${p.v}" style="flex:1;" onchange="mbUpdateLookupPair('${tf}',${i},'v',this.value)">
        <button class="icon-btn danger" onclick="mbRemoveLookupPair('${tf}',${i})">✕</button>
      </div>`;
    });
    html += `<button class="btn-ghost btn-sm" style="align-self:flex-start;" onclick="mbAddLookupPair('${tf}')">+ Add row</button>`;
  } else if (rule.transform === "custom_js") {
    html += `<textarea placeholder="e.g. upper(fields.firstName) + ' ' + upper(fields.lastName)" onchange="mbUpdateOpField('${tf}','customJs',this.value)">${rule.customJs || ""}</textarea>
      <div class="op-hint">Sandboxed expression — <code>fields.x</code> reads a source field; helpers: upper() lower() trim() substr() concat() coalesce() toNumber() toString() length(). No loops or other identifiers allowed; validated on save.</div>`;
  } else {
    html += `<div class="op-hint">Copies the source value as-is, no transformation.</div>`;
  }

  html += `</div>`;
  return html;
}

function mbSetTransform(targetField, transform) {
  const r = findRule(targetField);
  if (!r) return;
  r.transform = transform;
  // Switching operation type invalidates the old type's extra fields —
  // clear them so a leftover date pattern doesn't silently apply under lookup_table, etc.
  delete r.sourceFields; delete r.separator; delete r.dateFormat;
  delete r.staticValue; delete r.lookupTable; delete r.lookupPairs; delete r.customJs;
  mbRenderSourceFields();
  mbRenderTargetFields();
}
function mbUpdateOpField(targetField, key, value) { const r = findRule(targetField); if (r) r[key] = value; }
function mbToggleConcatField(targetField, fieldName, checked) {
  const r = findRule(targetField); if (!r) return;
  r.sourceFields = r.sourceFields || (r.sourceField ? [r.sourceField] : []);
  if (checked) { if (!r.sourceFields.includes(fieldName)) r.sourceFields.push(fieldName); }
  else { r.sourceFields = r.sourceFields.filter(x => x !== fieldName); }
}
function mbAddLookupPair(targetField) { const r = findRule(targetField); if (!r) return; r.lookupPairs = r.lookupPairs || []; r.lookupPairs.push({ k: "", v: "" }); mbRenderTargetFields(); }
function mbUpdateLookupPair(targetField, idx, field, value) { const r = findRule(targetField); if (!r || !r.lookupPairs) return; r.lookupPairs[idx][field] = value; }
function mbRemoveLookupPair(targetField, idx) { const r = findRule(targetField); if (!r || !r.lookupPairs) return; r.lookupPairs.splice(idx, 1); mbRenderTargetFields(); }

function isRuleComplete(r) {
  if (r.transform === "static_value") return true;
  if (r.transform === "concat") return Boolean(r.sourceFields && r.sourceFields.length);
  if (r.transform === "custom_js") return Boolean(r.customJs);
  return Boolean(r.sourceField);
}

function buildFieldMappingsPayload() {
  return builderState.rules.filter(isRuleComplete).map(r => {
    const rule = { targetField: r.targetField, transform: r.transform };
    if (r.sourceField) rule.sourceField = r.sourceField;
    if (r.sourceFields) rule.sourceFields = r.sourceFields;
    if (r.separator) rule.separator = r.separator;
    if (r.dateFormat) rule.dateFormat = r.dateFormat;
    if (r.staticValue !== undefined && r.staticValue !== "") rule.staticValue = r.staticValue;
    if (r.transform === "lookup_table") {
      const table = {};
      (r.lookupPairs || []).forEach(p => { if (p.k) table[p.k] = p.v; });
      rule.lookupTable = table;
    }
    if (r.customJs) rule.customJs = r.customJs;
    return rule;
  });
}

async function saveMapping() {
  const errEl = $("mbError");
  errEl.style.display = "none";
  const payload = {
    name: $("mbName").value, sourceConnectionId: builderState.sourceConnId, targetConnectionId: builderState.targetConnId,
    sourceObject: builderState.sourceObj, targetObject: builderState.targetObj,
    fieldMappings: buildFieldMappingsPayload(),
    triggerType: "poll", pollIntervalSec: 300,
  };
  try {
    if (builderState.editId) {
      await api(`/mappings/${builderState.editId}`, { method: "PATCH", body: JSON.stringify(payload) });
    } else {
      await api("/mappings", { method: "POST", body: JSON.stringify(payload) });
    }
    closeModal();
    renderMappingsView();
  } catch (err) { errEl.textContent = err.message; errEl.style.display = "block"; }
}

// ───────────────────────── JOBS ─────────────────────────
async function renderJobsView() {
  const main = $("mainArea");
  main.innerHTML = viewHeader("Jobs", "Recent sync run history — click a row for full detail") + '<div id="jobList" class="panel"></div>';
  try {
    const jobs = await api("/jobs");
    $("jobList").innerHTML = jobs.length === 0 ? '<div class="empty"><div class="empty-icon">◌</div>No sync jobs yet.</div>' :
      `<table><thead><tr><th>Mapping</th><th>Status</th><th>Records</th><th>Started</th></tr></thead><tbody>${
        jobs.map(j => `<tr style="cursor:pointer;" onclick="openJobDetail('${j.id}')">
          <td>${j.mapping?.name || j.mappingId}</td>
          <td><span class="badge ${j.status === 'SUCCESS' ? 'badge-green' : j.status === 'FAILED' ? 'badge-rose' : j.status === 'RETRYING' ? 'badge-amber' : 'badge-gray'}">${j.status}</span></td>
          <td class="mono">${j.recordsRead} read / ${j.recordsWritten} written</td>
          <td class="mono" style="font-size:11px;color:var(--text-dim);">${new Date(j.createdAt).toLocaleString()}</td>
        </tr>`).join("")
      }</tbody></table>`;
  } catch (err) { $("jobList").innerHTML = `<div class="empty status-err">${err.message}</div>`; }
}

async function openJobDetail(jobId) {
  try {
    const j = await api(`/jobs/${jobId}`);
    const duration = j.startedAt && j.finishedAt
      ? Math.round((new Date(j.finishedAt) - new Date(j.startedAt)) / 1000) + "s"
      : j.startedAt ? "still running" : "not yet started";
    openModal("Job detail", `
      <div class="detail-grid">
        <div><div class="detail-item-label">Mapping</div><div class="detail-item-value">${j.mapping?.name || j.mappingId}</div></div>
        <div><div class="detail-item-label">Status</div><div class="detail-item-value"><span class="badge ${j.status === 'SUCCESS' ? 'badge-green' : j.status === 'FAILED' ? 'badge-rose' : j.status === 'RETRYING' ? 'badge-amber' : 'badge-gray'}">${j.status}</span></div></div>
        <div><div class="detail-item-label">Source → Target</div><div class="detail-item-value">${j.mapping ? `${j.mapping.sourceObject} → ${j.mapping.targetObject}` : "—"}</div></div>
        <div><div class="detail-item-label">Attempt</div><div class="detail-item-value">${j.attempt}</div></div>
        <div><div class="detail-item-label">Records read</div><div class="detail-item-value">${j.recordsRead}</div></div>
        <div><div class="detail-item-label">Records written</div><div class="detail-item-value">${j.recordsWritten}</div></div>
        <div><div class="detail-item-label">Started</div><div class="detail-item-value">${j.startedAt ? new Date(j.startedAt).toLocaleString() : "—"}</div></div>
        <div><div class="detail-item-label">Duration</div><div class="detail-item-value">${duration}</div></div>
        <div><div class="detail-item-label">Queued at</div><div class="detail-item-value">${new Date(j.createdAt).toLocaleString()}</div></div>
        <div><div class="detail-item-label">Finished</div><div class="detail-item-value">${j.finishedAt ? new Date(j.finishedAt).toLocaleString() : "—"}</div></div>
      </div>
      ${j.errorMessage ? `<div style="margin-top:14px;"><div class="detail-item-label">Error</div><div class="detail-item-value" style="color:var(--rose);background:rgba(251,113,133,0.08);border:1px solid rgba(251,113,133,0.25);border-radius:6px;padding:10px 12px;margin-top:4px;">${j.errorMessage}</div></div>` : ""}
      ${j.status === "FAILED" ? `<button class="btn-primary btn-sm" style="align-self:flex-start;margin-top:14px;" onclick="closeModal();triggerSync('${j.mappingId}')">Retry sync</button>` : ""}
    `);
  } catch (err) { toast("Error: " + err.message, "error"); }
}

// ───────────────────────── USAGE ─────────────────────────
async function renderUsageView() {
  const main = $("mainArea");
  main.innerHTML = viewHeader("Usage", "This month's sync quota") + '<div id="usageBox" class="panel card"></div>';
  try {
    const u = await api("/tenants/me/usage");
    const pct = u.quota === -1 ? 0 : Math.min(100, Math.round((u.used / u.quota) * 100));
    $("usageBox").innerHTML = `
      <div style="font-size:13px;color:var(--text-dim);margin-bottom:8px;">Plan: <span class="mono" style="color:var(--teal);">${u.plan}</span></div>
      <div style="font-size:28px;font-weight:600;">${u.used} <span style="font-size:14px;color:var(--text-dim);font-weight:400;">/ ${u.quota === -1 ? '∞' : u.quota} syncs used</span></div>
      ${u.quota !== -1 ? `<div style="background:var(--bg);border-radius:6px;height:8px;margin-top:14px;overflow:hidden;"><div style="background:var(--teal);height:100%;width:${pct}%;"></div></div>` : ""}
    `;
  } catch (err) { $("usageBox").innerHTML = `<div class="status-err">${err.message}</div>`; }
}

// ───────────────────────── API KEYS (tenant self-service) ─────────────────────────
async function renderApiKeysView() {
  const main = $("mainArea");
  main.innerHTML = viewHeader("API Keys", "Keys that can authenticate as this tenant", '<button class="btn-primary" onclick="openNewApiKeyModal()">+ New key</button>') + '<div id="apiKeyList" class="panel"></div>';
  try {
    const keys = await api("/api-keys");
    $("apiKeyList").innerHTML = keys.length === 0
      ? '<div class="empty">No API keys yet.</div>'
      : `<table><thead><tr><th>Label</th><th>Created</th><th>Status</th><th></th></tr></thead><tbody>${
          keys.map(k => `<tr>
            <td>${k.label || "(unlabeled)"}</td>
            <td class="mono" style="font-size:11px;color:var(--text-dim);">${new Date(k.createdAt).toLocaleDateString()}</td>
            <td><span class="badge ${k.revokedAt ? "badge-rose" : "badge-green"}">${k.revokedAt ? "revoked" : "active"}</span></td>
            <td>${!k.revokedAt ? `<button class="btn-danger btn-sm" onclick="revokeApiKey('${k.id}')">Revoke</button>` : ""}</td>
          </tr>`).join("")
        }</tbody></table>`;
  } catch (err) {
    $("apiKeyList").innerHTML = `<div class="empty status-err">${err.message}</div>`;
  }
}

function openNewApiKeyModal() {
  openModal("New API key", `
    <div class="field-row"><label>Label <span style="color:var(--text-dim);font-weight:400;">(optional)</span></label><input id="newKeyLabel" placeholder="e.g. CI pipeline, staging server"></div>
    <div id="newKeyError" class="status-err" style="display:none;"></div>
    <button class="btn-primary" onclick="createApiKey()">Create key</button>
  `);
}

async function createApiKey() {
  const errEl = $("newKeyError");
  errEl.style.display = "none";
  try {
    const result = await api("/api-keys", { method: "POST", body: JSON.stringify({ label: $("newKeyLabel").value || undefined }) });
    openModal("API key created", `
      <p style="font-size:13px;color:var(--text-dim);">Shown once — copy it now, it can't be retrieved again:</p>
      <input readonly value="${result.apiKey}" class="mono" onclick="this.select()">
    `);
  } catch (err) { errEl.textContent = err.message; errEl.style.display = "block"; }
}

async function revokeApiKey(id) {
  // Guard against locking yourself out — revoking your only active key
  // would leave no way back into the dashboard short of an admin
  // re-bootstrapping one for you.
  let extraWarning = "";
  try {
    const keys = await api("/api-keys");
    const activeCount = keys.filter(k => !k.revokedAt).length;
    if (activeCount <= 1) extraWarning = " This is your ONLY active key — revoking it will lock you out of this dashboard until an admin issues a new one.";
  } catch (e) {}
  if (!(await confirmModal("Revoke this API key? Anything using it stops working immediately." + extraWarning, { danger: true, confirmLabel: "Revoke" }))) return;
  try {
    await api(`/api-keys/${id}`, { method: "DELETE" });
    toast("Key revoked", "success");
    renderApiKeysView();
  } catch (err) { toast("Error: " + err.message, "error"); }
}

// ───────────────────────── ADMIN: TENANTS ─────────────────────────
async function renderTenantsView() {
  const main = $("mainArea");
  main.innerHTML = viewHeader("Tenants", "All customers on this platform", '<button class="btn-primary" onclick="openNewTenantModal()">+ New tenant</button>') + '<div id="tenantList" class="panel"></div>';
  try {
    const tenants = await api("/tenants");
    $("tenantList").innerHTML = tenants.length === 0 ? '<div class="empty">No tenants yet.</div>' :
      `<table><thead><tr><th>Name</th><th>Plan</th><th>Created</th><th></th></tr></thead><tbody>${
        tenants.map(t => `<tr>
          <td>${t.name}</td>
          <td><span class="badge badge-teal">${t.plan?.name || t.planId}</span></td>
          <td class="mono" style="font-size:11px;color:var(--text-dim);">${new Date(t.createdAt).toLocaleDateString()}</td>
          <td><button class="btn-ghost btn-sm" onclick="bootstrapKey('${t.id}')">Issue API key</button></td>
        </tr>`).join("")
      }</tbody></table>`;
  } catch (err) { $("tenantList").innerHTML = `<div class="empty status-err">${err.message}</div>`; }
}

function openNewTenantModal() {
  openModal("New tenant", `
    <div class="field-row"><label>Name</label><input id="newTenantName" placeholder="Customer name"></div>
    <div class="field-row"><label>Plan</label><select id="newTenantPlan"><option value="free">Free</option><option value="pro" selected>Pro</option><option value="enterprise">Enterprise</option></select></div>
    <div id="newTenantError" class="status-err" style="display:none;"></div>
    <button class="btn-primary" onclick="createTenant()">Create tenant</button>
  `);
}
async function createTenant() {
  const errEl = $("newTenantError");
  errEl.style.display = "none";
  try {
    const tenant = await api("/tenants", { method: "POST", body: JSON.stringify({ name: $("newTenantName").value, planId: $("newTenantPlan").value }) });
    closeModal();
    renderTenantsView();
    setTimeout(() => bootstrapKey(tenant.id), 300);
  } catch (err) { errEl.textContent = err.message; errEl.style.display = "block"; }
}
async function bootstrapKey(tenantId) {
  try {
    const result = await api(`/api-keys/tenants/${tenantId}/bootstrap`, { method: "POST" });
    openModal("API key issued", `
      <p style="font-size:13px;color:var(--text-dim);">Shown once — copy it now, it can't be retrieved again:</p>
      <input readonly value="${result.apiKey}" class="mono" onclick="this.select()">
    `);
  } catch (err) { toast("Error: " + err.message, "error"); }
}

// ───────────────────────── ADMIN: BACKUP ─────────────────────────
async function renderBackupView() {
  const main = $("mainArea");
  main.innerHTML = viewHeader("Backup configuration", "Automatic database backups") + '<div id="backupBox" class="panel card"></div><div style="height:16px;"></div><div id="backupHistory" class="panel"></div>';
  try {
    const cfg = await api("/admin/backup-config");
    $("backupBox").innerHTML = `
      <div class="row2" style="margin-bottom:12px;">
        <div class="field-row"><label>Enabled</label><select id="bkEnabled"><option value="true" ${cfg.enabled ? "selected" : ""}>Yes</option><option value="false" ${!cfg.enabled ? "selected" : ""}>No</option></select></div>
        <div class="field-row"><label>Cron schedule</label><input id="bkCron" value="${cfg.cronSchedule}"></div>
      </div>
      <div class="row2" style="margin-bottom:12px;">
        <div class="field-row"><label>Retention (days)</label><input id="bkRetention" type="number" value="${cfg.retentionDays}"></div>
        <div class="field-row"><label>Storage</label><select id="bkStorage"><option value="s3" ${cfg.storageProvider === 's3' ? 'selected' : ''}>S3</option><option value="local" ${cfg.storageProvider === 'local' ? 'selected' : ''}>Local</option></select></div>
      </div>
      <div class="field-row" style="margin-bottom:12px;"><label>S3 bucket</label><input id="bkBucket" value="${cfg.s3Bucket || ''}"></div>
      <div style="font-size:11px;color:var(--text-dim);margin-bottom:12px;">Last run: <span class="mono">${cfg.lastRunAt ? new Date(cfg.lastRunAt).toLocaleString() : 'never'}</span> · S3 credentials: <span class="mono">${cfg.s3CredentialsSet ? 'set' : 'using env fallback'}</span></div>
      <div style="display:flex;gap:8px;">
        <button class="btn-primary" onclick="saveBackupConfig()">Save</button>
        <button class="btn-ghost" onclick="runBackupNow()">Run now</button>
      </div>
      <div id="backupError" class="status-err" style="display:none;"></div>
    `;
    const history = await api("/admin/backup-config/history");
    $("backupHistory").innerHTML = history.length === 0 ? '<div class="empty">No backup runs yet.</div>' :
      `<table><thead><tr><th>Trigger</th><th>Status</th><th>Size</th><th>Started</th></tr></thead><tbody>${
        history.map(h => `<tr>
          <td class="mono">${h.trigger}</td>
          <td><span class="badge ${h.status === 'success' ? 'badge-green' : h.status === 'failed' ? 'badge-rose' : 'badge-amber'}">${h.status}</span></td>
          <td class="mono">${h.sizeBytes ? (h.sizeBytes / 1024).toFixed(1) + ' KB' : '—'}</td>
          <td class="mono" style="font-size:11px;color:var(--text-dim);">${new Date(h.startedAt).toLocaleString()}</td>
        </tr>`).join("")
      }</tbody></table>`;
  } catch (err) { $("backupBox").innerHTML = `<div class="status-err">${err.message}</div>`; }
}
async function saveBackupConfig() {
  const errEl = $("backupError");
  errEl.style.display = "none";
  try {
    await api("/admin/backup-config", { method: "PATCH", body: JSON.stringify({
      enabled: $("bkEnabled").value === "true", cronSchedule: $("bkCron").value,
      retentionDays: Number($("bkRetention").value), storageProvider: $("bkStorage").value,
      s3Bucket: $("bkBucket").value || undefined,
    })});
    renderBackupView();
  } catch (err) { errEl.textContent = err.message; errEl.style.display = "block"; }
}
async function runBackupNow() {
  try { await api("/admin/backup-config/run-now", { method: "POST" }); toast("Backup started", "success"); renderBackupView(); }
  catch (err) { toast("Error: " + err.message, "error"); }
}

// ───────────────────────── Boot ─────────────────────────
if (session && session.key) { showDashboard(); }
</script>
