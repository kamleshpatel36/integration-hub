# Free-tier variant of render.yaml: ONE web service instead of four,
# running the API, BullMQ worker, poll scheduler, and backup scheduler all
# in-process (RUN_INLINE_WORKERS=true) — Render's Free plan doesn't offer a
# free Background Worker instance type, only Web Services get one.
#
# Trade-offs vs. the multi-service render.yaml: everything shares one
# instance's CPU/RAM, a crash path in one part can't be isolated from the
# others as cleanly, and there's no independent scaling. Fine for a pilot;
# switch to render.yaml (and pay for Starter workers) before real load.
#
# To use this instead: rename this file to render.yaml (replacing the
# multi-service one) before connecting the Blueprint, or manually create a
# single Web Service pointing at this repo with the env vars below.

envVarGroups:
  - name: integration-hub-shared
    envVars:
      - key: CREDENTIALS_MASTER_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: RUN_INLINE_WORKERS
        value: "true"
      - key: BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
      - key: KMS_KEY_ID
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

databases:
  - name: integration-hub-db
    plan: free
    databaseName: integration_hub
    user: integration_hub

services:
  - type: keyvalue
    name: integration-hub-redis
    plan: free
    ipAllowList: []

  - type: web
    name: integration-hub-api
    runtime: docker
    plan: free
    dockerCommand: sh -c "npx prisma migrate deploy && node dist/index.js"
    envVars:
      - fromGroup: integration-hub-shared
      - key: DATABASE_URL
        fromDatabase:
          name: integration-hub-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: integration-hub-redis
          type: keyvalue
          property: connectionString
      - key: PORT
        value: 3000
